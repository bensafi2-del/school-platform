name: Smart grade import checks

on:
  push:
    branches:
      - feature/smart-grade-import
    paths:
      - "grade-import.js"
      - "ocr-service/**"
      - ".github/workflows/grade-import.yml"
  pull_request:
    paths:
      - "grade-import.js"
      - "ocr-service/**"
      - ".github/workflows/grade-import.yml"

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ocr-service/requirements.txt

      - name: Install OCR dependencies
        working-directory: ocr-service
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        working-directory: ocr-service
        run: python -m compileall -q app tests

      - name: Run parser tests
        working-directory: ocr-service
        run: python -m unittest discover -s tests -v

      - name: Check browser module syntax
        run: node --check grade-import.js

      - name: Build OCR container
        run: docker build -t school-grade-import ocr-service
