<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة تسيير الطور المتوسط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--wd:#641E35;--w:#7B263F;--g:#D4AF6A;--gl:#E9D7A5;--bg:#F7F5F2;--card:#fff;--ink:#29232A;--mut:#817680;--line:#E9E1E4;--cream:#FBF4E3;--rose:#F6ECEF;--err:#B3261E;--sh:0 1px 2px rgba(100,30,53,.05),0 8px 22px rgba(100,30,53,.06)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:'IBM Plex Sans Arabic','Cairo','Tajawal',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}

/* ---------- تسجيل الدخول ---------- */
.authwrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,var(--wd),var(--w))}
.authcard{width:min(420px,100%);background:#fff;border-radius:20px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.authcard .logo{margin:0 auto 12px}
.authcard h1{margin:0 0 4px;text-align:center;font-size:21px;color:var(--wd)}
.authcard p{margin:0 0 16px;text-align:center;color:var(--mut);font-size:14px}
.authmsg{min-height:22px;margin-top:10px;text-align:center;font-size:14px}

/* ---------- الهيكل ---------- */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--wd) 0%,var(--w) 100%);color:#fff;z-index:40}
.side-head{display:flex;align-items:center;gap:12px;padding:20px 18px 16px;border-bottom:1px solid rgba(233,215,165,.2)}
.logo{width:44px;height:44px;border-radius:13px;background:var(--g);color:var(--wd);display:grid;place-items:center;flex:none}
.logo .i{width:24px;height:24px}
.brand b{display:block;font-size:16.5px;line-height:1.35}
.brand small{color:var(--gl);font-size:12.5px}
.nav{flex:1;overflow-y:auto;padding:6px 12px 14px;scrollbar-width:thin;scrollbar-color:rgba(233,215,165,.4) transparent}
.nav h6{margin:16px 10px 6px;font-size:12.5px;font-weight:600;color:var(--gl);opacity:.85}
.ni{position:relative;display:flex;align-items:center;gap:12px;width:100%;margin:2px 0;padding:10px 12px;border:0;border-radius:11px;background:none;color:#F6E9EE;font-size:15px;cursor:pointer;text-align:start}
.ni:hover{background:rgba(255,255,255,.08)}
.ni.on{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.ni.on .i{color:var(--g)}
.ni.on::before{content:'';position:absolute;inset-block:9px;inset-inline-start:0;width:3px;border-radius:3px;background:var(--g)}
.side-foot{padding:12px;border-top:1px solid rgba(233,215,165,.2)}
.scrim{display:none;position:fixed;inset:0;background:rgba(41,35,42,.5);z-index:35}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 26px;background:rgba(247,245,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:23px;line-height:1.3;color:var(--wd)}
.ttl .sub{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 11px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--mut)}
.pill .i{width:14px;height:14px}
.pill.gold{background:var(--cream);border-color:var(--gl);color:var(--wd)}
.tools{display:flex;align-items:center;gap:10px}
.icbtn{position:relative;display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--wd);cursor:pointer}
.menubtn{display:none}
.badge{position:absolute;top:-6px;inset-inline-end:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--g);color:var(--wd);font-size:12px;font-weight:700;display:grid;place-items:center;font-style:normal}
.usr{display:flex;align-items:center;gap:9px;padding:4px 12px 4px 8px;border:1px solid var(--line);border-radius:99px;background:#fff;cursor:pointer}
.av{width:32px;height:32px;border-radius:50%;background:var(--w);color:var(--g);display:grid;place-items:center;font-weight:700}
.un{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.schsel{width:auto;max-width:220px;padding:8px 10px}
.ddw{position:relative}
.dd{position:absolute;top:calc(100% + 8px);left:0;width:min(330px,86vw);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(100,30,53,.18);padding:8px;z-index:50}
.dd .it{display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px;border:0;border-radius:10px;background:none;text-align:start;cursor:pointer;font-size:14px}
.dd .it:hover{background:var(--rose)}
.dd .it .i{width:18px;height:18px;margin-top:3px;color:var(--w)}
.dd .hd{padding:8px 10px;font-weight:600;color:var(--wd);border-bottom:1px solid var(--line);margin-bottom:4px}
.content{flex:1;padding:22px 26px 44px}

/* ---------- بطاقات ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:18px}
.card+.card{margin-top:16px}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:16.5px;color:var(--wd)}
.card h3 .i{color:var(--g)}
.card h3 .sp{flex:1}
.stats1{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.stat1{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;padding:18px 20px;border:1px solid var(--gl);border-radius:18px;background:linear-gradient(135deg,#fff 35%,var(--cream) 100%);box-shadow:var(--sh)}
.stat1::after{content:'';position:absolute;inset-block:0;inset-inline-start:0;width:5px;background:linear-gradient(180deg,var(--g),var(--w))}
.ic{display:grid;place-items:center;width:54px;height:54px;border-radius:15px;background:var(--wd);color:var(--g);flex:none}
.ic .i{width:27px;height:27px}
.stat1 .v{font-size:34px;font-weight:700;line-height:1.15;color:var(--wd)}
.stat1 .v small{font-size:15px;font-weight:500;color:var(--mut)}
.stat1 .l{font-size:15px;font-weight:600}
.stat1 .h{font-size:12.5px;color:var(--mut)}
.stats2{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-top:16px}
.stat2{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.stat2 .ic{width:42px;height:42px;border-radius:12px;background:var(--rose);color:var(--w)}
.stat2 .ic .i{width:22px;height:22px}
.stat2 .v{font-size:23px;font-weight:700;line-height:1.2}
.stat2 .l{font-size:13px;color:var(--mut)}
.notice{display:flex;align-items:flex-start;gap:10px;margin-top:16px;padding:11px 14px;border:1px solid var(--gl);border-inline-start:4px solid var(--g);border-radius:12px;background:var(--cream);font-size:13.5px;color:#5A3A2A}
.notice .i{width:18px;height:18px;margin-top:3px;color:var(--w)}
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-top:16px;align-items:start}
.dgrid .card+.card{margin-top:0}
.c7{grid-column:span 7}.c5{grid-column:span 5}.c12{grid-column:span 12}.c6{grid-column:span 6}

/* ---------- مخططات ---------- */
.bars{display:flex;align-items:flex-end;gap:10px;height:215px;padding-top:6px;border-bottom:1px solid var(--line)}
.bcol{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bval{margin-bottom:4px;font-size:13px;font-weight:600}
.bar{width:68%;max-width:58px;min-height:3px;border-radius:9px 9px 0 0;background:var(--w)}
.bar.low{background:var(--g)}
.blab{display:flex;gap:10px;margin-top:6px}
.blab span{flex:1;text-align:center;font-size:12.5px;color:var(--mut)}
.legend{display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--mut)}
.legend i{display:inline-block;width:11px;height:11px;margin-inline-end:6px;border-radius:3px;background:var(--w)}
.legend i.low{background:var(--g)}
.donutbox{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut div{width:106px;height:106px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;line-height:1.2;font-size:12.5px;color:var(--mut)}
.donut b{display:block;font-size:27px;color:var(--wd)}
.kv{flex:1;min-width:170px}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv div:last-child{border:0}
.kv b{color:var(--wd)}
.glist{max-height:370px;overflow:auto}
.grow{display:grid;grid-template-columns:62px minmax(0,1fr) 54px 60px;gap:12px;align-items:center;width:100%;padding:9px 6px;border:0;border-bottom:1px solid var(--line);background:none;text-align:start;cursor:pointer}
.grow:hover{background:var(--rose)}
.pbar{height:8px;border-radius:99px;background:#F1E9EB;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--w),var(--g))}
.grow .nm{font-weight:600;color:var(--wd)}
.grow .ct{font-size:13px;color:var(--mut)}
.shorts{display:grid;gap:10px}
.short{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:start;font-weight:600}
.short:hover{border-color:var(--g);background:var(--cream)}
.short .ic{width:38px;height:38px;border-radius:11px}
.short .ic .i{width:20px;height:20px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed li:last-child{border:0}
.feed .dot{width:30px;height:30px;border-radius:9px;background:var(--rose);color:var(--w);display:grid;place-items:center;flex:none}
.feed .dot .i{width:16px;height:16px}
.feed time{display:block;font-size:12.5px;color:var(--mut)}
.alist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.alist button{display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:start;cursor:pointer;font-size:14px}
.alist button.warn{border-color:var(--gl);background:var(--cream)}
.alist .i{width:18px;height:18px;margin-top:3px;color:var(--w)}
.empty{padding:26px 12px;text-align:center;color:var(--mut)}
.empty b{display:block;margin-bottom:4px;color:var(--ink)}
.empty .btn{margin-top:12px}

/* ---------- نماذج وجداول ---------- */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--mut)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--g);outline:2px solid var(--gl)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border:0;border-radius:10px;background:var(--w);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--wd)}
.btn .i{width:18px;height:18px}
.btn.gold{background:var(--g);color:var(--wd)}
.btn.ghost{background:var(--rose);color:var(--wd)}
.btn.danger{background:#fff;color:var(--err);border:1px solid #E8C5C2}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.full{width:100%}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.row.sb{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{padding:6px 13px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--w);border-color:var(--w);color:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tab{padding:9px 15px;border:0;border-bottom:3px solid transparent;background:none;color:var(--mut);font-weight:600;cursor:pointer}
.tab.on{color:var(--wd);border-bottom-color:var(--g)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--rose);color:var(--wd);font-weight:600;white-space:nowrap}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td input{width:80px;padding:6px 8px}
td input.wide{width:150px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--rose)}
.note{font-size:13px;color:var(--mut)}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;background:var(--rose);color:var(--wd);font-size:12.5px}
.tag.ok{background:var(--wd);color:#fff}
.tag.low{background:var(--cream);color:#7A4B00;border:1px solid var(--gl)}
.warnbox{margin-bottom:12px;padding:10px 14px;border:1px solid var(--gl);border-inline-start:4px solid var(--g);border-radius:10px;background:var(--cream);font-size:14px}
.sthead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
.sthead h2{margin:0;font-size:20px;color:var(--wd)}
.spin{width:34px;height:34px;margin:0 auto 12px;border:4px solid var(--gl);border-top-color:var(--w);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:92vw;padding:11px 18px;border-radius:12px;background:var(--wd);color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.25);z-index:99;font-size:14.5px}
#toast.err{background:var(--err)}

/* ---------- كشف النقاط ---------- */
.rcard{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff;color:#000}
.rcard h4{margin:0 0 2px;text-align:center;font-size:16px}
.rcard .rs{text-align:center;font-size:13px;color:#555;margin-bottom:10px}
.rcard .rg{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:10px 0;font-size:14px}
.rcard .rtot{margin-top:10px;font-weight:700}
.rcard .rrem{min-height:48px;margin-top:6px;padding:8px;border:1px solid #bbb;border-radius:6px;font-size:14px}
.rcard .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;font-size:13px;text-align:center}
.rcard .sig div{height:70px;border:1px dashed #999;border-radius:6px;padding-top:6px}
#printHost{display:none}

/* ---------- الشاشات الصغيرة ---------- */
@media (max-width:1100px){.c7,.c5,.c6{grid-column:span 12}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;right:0;width:272px;transform:translateX(100%);transition:transform .25s ease;box-shadow:-10px 0 30px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .scrim.show{display:block}
  .menubtn{display:grid}
  .top{padding:10px 14px;gap:10px}
  .ttl h1{font-size:19px}
  .un{display:none}
  .content{padding:14px 14px 36px}
  .schsel{display:none}
}
@media (max-width:520px){
  .stat1 .v{font-size:28px}
  .rcard .rg{grid-template-columns:1fr}
  .grow{grid-template-columns:54px minmax(0,1fr) 50px}
  .grow .ct{display:none}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}.spin{animation:none}}

/* ---------- الطباعة ---------- */
@media print{
  body{background:#fff}
  #auth,#app,#toast{display:none!important}
  #printHost{display:block!important}
  .rcard{border:0;padding:0 4px;break-after:page;page-break-after:always}
  .rcard:last-child{break-after:auto;page-break-after:auto}
  th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="auth" class="authwrap">
  <div class="authcard">
    <div class="logo" id="authLogo"></div>
    <h1>منصة تسيير الطور المتوسط</h1>
    <p>سجّل الدخول لإدارة مؤسستك</p>
    <label class="f">البريد الإلكتروني<input id="email" type="email" autocomplete="email"></label>
    <label class="f" style="margin-top:12px">كلمة المرور<input id="password" type="password" autocomplete="current-password"></label>
    <button class="btn full" style="margin-top:16px" onclick="login()">تسجيل الدخول</button>
    <button class="btn ghost full" style="margin-top:10px" onclick="signup()">إنشاء حساب جديد</button>
    <button class="btn ghost full" style="margin-top:10px" onclick="resetPw()">نسيت كلمة المرور؟</button>
    <div id="authMsg" class="authmsg"></div>
  </div>
</div>

<!-- التطبيق -->
<div id="app" class="hidden">
  <div class="shell">
    <aside class="side" id="side"></aside>
    <div class="main">
      <header class="top" id="top"></header>
      <main class="content" id="content"></main>
    </div>
  </div>
  <div class="scrim" id="scrim" onclick="toggleMenu()"></div>
</div>

<div id="printHost"></div>
<div id="toast" role="status"></div>

<script>

const PROPOSED=['اللغة العربية','الرياضيات','اللغة الفرنسية','اللغة الإنجليزية','العلوم الطبيعية','العلوم الفيزيائية والتكنولوجيا','التاريخ والجغرافيا','التربية الإسلامية','التربية المدنية','الإعلام الآلي','التربية الفنية','التربية البدنية والرياضية'];

const ICON={
 home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
 building:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/>',
 layers:'<path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>',
 user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',

async function signup(){

  authSay('تم إنشاء الحساب. افتح بريدك واضغط رابط التأكيد، ثم سجّل الدخول.',true);

sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY') S.recovering=true;
  setTimeout(()=>{
    if(session){
      if(!S.user||S.user.id!==session.user.id){S.user=session.user;boot();}
    }else{
      S.user=null;S.school=null;S.schools=[];S.ready=false;
      $('app').classList.add('hidden');$('auth').classList.remove('hidden');

  },0);
});

async function boot(){
  $('auth').classList.add('hidden');$('app').classList.remove('hidden');
  $('password').value='';
  S.loading=true;S.err='';render();
  try{
    const {data:adm}=await sb.from('admins').select('user_id').eq('user_id',S.user.id);
    S.isAdmin=!!(adm&&adm.length);
    const {data,error}=await sb.from('schools').select('*').order('created_at',{ascending:false});
    if(error) throw error;
    S.schools=data;
    let saved=null;try{saved=localStorage.getItem('tmv_school');}catch(e){}
    const pick=S.schools.find(x=>x.id===saved)||S.schools[0];
    if(S.recovering){S.view='settings';S.setTab='account';}
    if(pick){await loadSchool(pick.id);}
    else{S.school=null;S.loading=false;S.view=S.recovering?'settings':'schools';render();}
  }catch(e){S.loading=false;S.err=e.message||String(e);render();}
}

async function fetchAll(build){
  const out=[],size=1000;
  for(let from=0;;from+=size){
    const {data,error}=await build(from,from+size-1);
    if(error) throw error;
    out.push(...data);
    if(data.length<size) break;
  }
  return out;
}

async function loadSchool(id){
  S.loading=true;S.err='';render();
  try{
    const sc=S.schools.find(x=>x.id===id);
    if(!sc) throw new Error('المؤسسة غير موجودة');
    const [groups,subjects,students,grades,abs]=await Promise.all([
      fetchAll((a,b)=>sb.from('school_groups').select('id,name,level,sort_order').eq('school_id',id).order('sort_order').range(a,b)),
      fetchAll((a,b)=>sb.from('subjects').select('id,name,coef,teacher_name,levels,sort_order').eq('school_id',id).order('sort_order').range(a,b)),
      fetchAll((a,b)=>sb.from('students').select('id,group_id,list_number,first_name,last_name,birth_date,sex,status,guardian_name,guardian_phone,admin_notes,council_remarks,created_at').eq('school_id',id).order('id').range(a,b)),
      fetchAll((a,b)=>sb.from('grades').select('id,student_id,subject_id,cc,f1,f2,ex,teacher_note').order('id').range(a,b)),
      fetchAll((a,b)=>sb.from('absences').select('id,student_id,subject_id,record_date,kind,justified,minutes,reason,created_at').order('id').range(a,b))
    ]);
    S.school=sc;
    S.groups=groups;S.gById=Object.fromEntries(groups.map(g=>[g.id,g]));
    S.subjects=subjects.map(s=>({...s,coef:Number(s.coef),levels:s.levels||[]}));
    S.students=students;
    const ids=new Set(students.map(s=>s.id));
    S.G={};
    grades.forEach(r=>{ if(!ids.has(r.student_id)) return; (S.G[r.student_id]=S.G[r.student_id]||{})[r.subject_id]={...r,cc:n(r.cc),f1:n(r.f1),f2:n(r.f2),ex:n(r.ex)}; });
    S.absBy={};
    abs.forEach(a=>{ if(!ids.has(a.student_id)) return; (S.absBy[a.student_id]=S.absBy[a.student_id]||[]).push(a); });
    Object.values(S.absBy).forEach(l=>l.sort((a,b)=>String(b.record_date).localeCompare(String(a.record_date))));
    if(!S.gById[S.gid]) S.gid=groups[0]?.id||null;
    S.subId=null;S.stId=null;S._dirty=true;S.loading=false;S.ready=true;
    try{localStorage.setItem('tmv_school',id);}catch(e){}
    render();
  }catch(e){S.loading=false;S.err=e.message||String(e);render();}
}

// ---------- الحسابات ----------
function subAvg(e){
  if(!e||!S.school) return null;
  const W={cc:+S.school.weight_cc,f1:+S.school.weight_f1,f2:+S.school.weight_f2,ex:+S.school.weight_ex};
  let t=0,w=0;
  CC.forEach(k=>{if(e[k]!=null){t+=e[k]*W[k];w+=W[k];}});
  return w?Math.round(t/w*100)/100:null;
}
function genAvg(st){
  const lv=S.gById[st.group_id]?.level;let t=0,c=0;
  S.subjects.forEach(sub=>{
    if(!sub.levels.includes(lv)) return;
    const a=subAvg(S.G[st.id]?.[sub.id]);
    if(a!=null){t+=a*sub.coef;c+=sub.coef;}
  });
  return c?Math.round(t/c*100)/100:null;
}
const curG=()=>S.gById[S.gid]||S.groups[0]||null;
const curSt=()=>S.students.find(s=>s.id===S.stId)||null;
const gStudents=g=>S.students.filter(s=>g&&s.group_id===g.id&&s.status==='مسجل').sort((a,b)=>a.list_number-b.list_number);
const nextNo=gid=>S.students.filter(s=>s.group_id===gid).reduce((m,s)=>Math.max(m,s.list_number),0)+1;
const absOf=id=>S.absBy[id]||[];
const countAbs=id=>absOf(id).filter(a=>a.kind==='غياب').length;

function stats(){
  const lim=S.school?+S.school.absence_limit:10;
  const act=S.students.filter(s=>s.status==='مسجل');
  const rows=act.map(st=>{
    const g=S.gById[st.group_id];const lv=g?.level;
    const subs=S.subjects.filter(x=>x.levels.includes(lv));
    let has=false,complete=subs.length>0;
    subs.forEach(x=>{if(subAvg(S.G[st.id]?.[x.id])==null)complete=false;else has=true;});
    const ab=absOf(st.id);
    return {st,g,avg:genAvg(st),has,complete,abs:ab.filter(a=>a.kind==='غياب').length,late:ab.filter(a=>a.kind==='تأخر').length};
  });
  const wa=rows.filter(r=>r.avg!=null);
  const pass=wa.filter(r=>r.avg>=10).length;
  const avgs=wa.map(r=>r.avg);
  const teachers=[...new Set(S.subjects.map(s=>(s.teacher_name||'').trim()).filter(Boolean))];
  return {rows,lim,nStudents:act.length,nAvg:wa.length,pass,fail:wa.length-pass,
    passRate:wa.length?Math.round(pass/wa.length*100):null,
    schoolAvg:wa.length?Math.round(avgs.reduce((t,x)=>t+x,0)/wa.length*100)/100:null,
    max:wa.length?Math.max(...avgs):null,min:wa.length?Math.min(...avgs):null,
    nWith:rows.filter(r=>r.has).length,nIncomplete:rows.filter(r=>!r.complete).length,
    nAbs:rows.reduce((t,r)=>t+r.abs,0),nLate:rows.reduce((t,r)=>t+r.late,0),
    over:rows.filter(r=>r.abs>=lim),teachers};
}
function getSt(){if(S._dirty||!S._st){S._st=stats();S._dirty=false;}return S._st;}
function grpStats(rows,pred){
  const r=rows.filter(pred),w=r.filter(x=>x.avg!=null),p=w.filter(x=>x.avg>=10).length;
  return {n:r.length,nAvg:w.length,avg:w.length?Math.round(w.reduce((t,x)=>t+x.avg,0)/w.length*100)/100:null,
    pass:p,rate:w.length?Math.round(p/w.length*100):null,
    max:w.length?Math.max(...w.map(x=>x.avg)):null,min:w.length?Math.min(...w.map(x=>x.avg)):null};
}
function alertsOf(st){
  const a=[],W=S.school;
  if(!S.subjects.length) a.push({t:'لم تُضف أي مادة بعد، لذلك لا يمكن حساب المعدلات.',v:'settings',tab:'subjects',lv:'warn'});
  if(W&&(+W.weight_cc)+(+W.weight_f1)+(+W.weight_f2)+(+W.weight_ex)===0) a.push({t:'كل أوزان التقويم صفر، فلن تظهر معدلات المواد.',v:'settings',tab:'weights',lv:'warn'});
  if(st.over.length) a.push({t:`${st.over.length} تلميذًا بلغوا حد الغيابات (${st.lim} أو أكثر).`,v:'reports',lv:'warn'});
  const noT=S.subjects.filter(s=>!(s.teacher_name||'').trim()).length;
  if(noT) a.push({t:`${noT} مادة بلا أستاذ محدد.`,v:'teachers',lv:'info'});
  if(st.nStudents&&S.subjects.length&&st.nIncomplete) a.push({t:`${st.nIncomplete} تلميذًا لم تُستكمل نتائجهم.`,v:'grades',lv:'info'});
  if(st.fail) a.push({t:`${st.fail} تلميذًا معدلهم دون 10/20، وقد تلزم متابعتهم.`,v:'avgs',lv:'info'});
  return a;
}

function distHtml(rows){
  const B=[[0,5],[5,8],[8,10],[10,12],[12,14],[14,16],[16,20.01]],L=['0–5','5–8','8–10','10–12','12–14','14–16','16–20'];
  const cnt=B.map(([a,b])=>rows.filter(r=>r.avg!=null&&r.avg>=a&&r.avg<b).length);
  const mx=Math.max(1,...cnt);
  return `<div class="bars">${cnt.map((c,i)=>`<div class="bcol"><span class="bval">${c}</span><div class="bar ${B[i][1]<=10?'low':''}" style="height:${Math.round(c/mx*78)}%"></div></div>`).join('')}</div><div class="blab">${L.map(l=>`<span>${l}</span>`).join('')}</div><div class="legend"><span><i class="low"></i>دون 10</span><span><i></i>10 فأكثر</span></div>`;
}
function dashHtml(){
  const st=getSt();
  const c1=[['users','التلاميذ المسجلون',st.nStudents,'تلميذ مسجل في المؤسسة'],
   ['layers','الأفواج والأقسام',S.groups.length,`${new Set(S.groups.map(g=>g.level)).size} مستويات`],
   ['trend','معدل المؤسسة العام',st.schoolAvg==null?'—':`${f2(st.schoolAvg)}<small> / 20</small>`,st.nAvg?`من ${st.nAvg} تلميذ لديهم معدل`:'لا توجد معدلات بعد'],
   ['percent','نسبة النجاح',st.passRate==null?'—':st.passRate+'%',st.nAvg?`${st.pass} من ${st.nAvg} بمعدل 10 فأكثر`:'لا توجد معدلات بعد']];

   <section class="card c7"><h3>${ic('layers')}الأفواج والأقسام<span class="sp"></span><button class="btn ghost sm" onclick="navTo('groups')">عرض الكل</button></h3>${S.groups.length?`<div class="glist">${rowsG.map(r=>`<button class="grow" onclick="S.gid='${r.g.id}';navTo('students')"><span class="nm">${esc(r.g.name)}</span><span><div class="pbar"><i style="width:${r.avg==null?0:Math.round(r.avg/20*100)}%"></i></div></span><span class="ct">${r.n} تلميذ</span><b>${f2(r.avg)}</b></button>`).join('')}</div>`:'<div class="empty">لا توجد أفواج.</div>'}</section>
   <section class="card c5"><h3>${ic('plus')}اختصارات سريعة</h3><div class="shorts">
     <button class="short" onclick="navTo('students',{focus:'stFirst'})"><span class="ic">${ic('user')}</span>إضافة تلميذ</button>
     <button class="short" onclick="navTo('grades')"><span class="ic">${ic('edit')}</span>إدخال العلامات</button>
     <button class="short" onclick="navTo('cards')"><span class="ic">${ic('file')}</span>عرض كشوف النقاط</button></div></section>
   <section class="card c7"><h3>${ic('clock')}آخر التسجيلات والغيابات</h3>${ev.length?`<ul class="feed">${ev.slice(0,8).map(e=>`<li><span class="dot">${ic(e.i)}</span><div>${esc(e.t)}<time>${esc(String(e.d).slice(0,10))}</time></div></li>`).join('')}</ul>`:'<div class="empty">لا توجد عمليات بعد.</div>'}</section>
   <section class="card c5"><h3>${ic('alert')}تنبيهات البيانات</h3>${S._alerts.length?`<ul class="alist">${S._alerts.map((a,i)=>`<li><button class="${a.lv}" onclick="goAlert(${i})">${ic(a.lv==='warn'?'alert':'info')}<span>${esc(a.t)}</span></button></li>`).join('')}</ul>`:'<div class="empty"><b>لا توجد تنبيهات</b>البيانات الحالية مكتملة.</div>'}</section>

async function addSchool(){
  const name=$('sc_name').value.trim(),year=$('sc_year').value.trim();
  if(!name) return say('اكتب اسم المؤسسة.',false);
  const {data,error}=await sb.from('schools').insert({name,school_year:year}).select().single();
  if(error) return say('لم تُحفظ المؤسسة: '+error.message,false);
  S.schools.unshift(data);say('تم حفظ المؤسسة بنجاح.');
  S.view='dash';await loadSchool(data.id);
}
async function openSchool(id){S.view='dash';await loadSchool(id);}
async function delSchool(id){
  if(!confirm('حذف هذه المؤسسة مع كل أفواجها وتلاميذها وعلاماتها؟')) return;
  const {error}=await sb.from('schools').delete().eq('id',id);
  if(error) return say('تعذر الحذف: '+error.message,false);
  S.schools=S.schools.filter(s=>s.id!==id);say('تم الحذف.');
  if(S.school&&S.school.id===id){
    if(S.schools[0]){S.view='dash';await loadSchool(S.schools[0].id);}
    else{S.school=null;S.groups=[];S.subjects=[];S.students=[];S.G={};S.absBy={};S.gById={};S._dirty=true;S.view='schools';render();}
  }else render();
}

  return `<div class="card"><h3>${ic('plus')}إضافة فوج</h3><div class="fgrid"><label class="f">اسم الفوج<input id="ng_name" placeholder="مثال: 1م5"></label><label class="f">المستوى<select id="ng_lvl">${[1,2,3,4].map(l=>`<option value="${l}">${LVN[l]}</option>`).join('')}</select></label></div><button class="btn" style="margin-top:12px" onclick="addGroup()">${ic('plus')}إضافة فوج</button></div>
  <div class="card"><h3>${ic('layers')}الأفواج والأقسام</h3><div class="tw"><table><tr><th>الفوج</th><th>المستوى</th><th>التلاميذ</th><th>المعدل</th><th>ناجحون</th><th></th></tr>${rows||'<tr><td colspan="6" class="note">لا توجد أفواج.</td></tr>'}</table></div><p class="note">يمكن تعديل اسم الفوج مباشرة من الجدول.</p></div>`;

async function addGroup(){
  const name=$('ng_name').value.trim(),level=Number($('ng_lvl').value);
  if(!name) return say('اكتب اسم الفوج.',false);
  const {data,error}=await sb.from('school_groups').insert({school_id:S.school.id,name,level,sort_order:S.groups.length+1}).select().single();
  if(error) return say('لم يُضف الفوج: '+error.message,false);
  S.groups.push(data);S.gById[data.id]=data;S._dirty=true;say('تمت إضافة الفوج.');render();
}
async function renameG(id,v){
  const name=v.trim();if(!name) return render();
  const {error}=await sb.from('school_groups').update({name}).eq('id',id);
  if(error){say('لم يُحفظ الاسم: '+error.message,false);return render();}
  S.gById[id].name=name;say('تم تغيير اسم الفوج.');
}
async function delGroup(id){
  if(S.students.some(s=>s.group_id===id)) return say('لا يمكن حذف فوج يحتوي على تلاميذ. انقلهم أو احذفهم أولًا.',false);
  if(!confirm('حذف هذا الفوج؟')) return;
  const {error}=await sb.from('school_groups').delete().eq('id',id);
  if(error) return say('تعذر الحذف: '+error.message,false);
  S.groups=S.groups.filter(g=>g.id!==id);delete S.gById[id];if(S.gid===id) S.gid=S.groups[0]?.id||null;
  S._dirty=true;say('تم حذف الفوج.');render();
}

function studentsHtml(){
  if(S.stId&&curSt()) return stPageHtml();
  const g=curG();
  if(!g) return emptyBox('لا توجد أفواج','أضف فوجًا أولًا.','groups','إلى الأفواج');
  return `<div class="card">${gchips()}<h3>${ic('plus')}إضافة تلميذ إلى الفوج ${esc(g.name)}</h3>
   <div class="fgrid"><label class="f">الاسم<input id="stFirst"></label><label class="f">اللقب<input id="stLast"></label><label class="f">تاريخ الميلاد<input id="stBirth" type="date"></label><label class="f">الجنس<select id="stSex"><option>ذكر</option><option>أنثى</option></select></label></div>
   <button class="btn" style="margin-top:12px" onclick="addStudent()">${ic('plus')}إضافة تلميذ</button></div>

}
function studentsTable(){
  const g=curG(),q=S.q.trim();
  const list=S.students.filter(s=>(q||s.group_id===g?.id)&&(S.arch||s.status==='مسجل')&&(!q||(s.first_name+' '+s.last_name+' '+s.list_number).includes(q))).sort((a,b)=>(S.gById[a.group_id]?.sort_order||0)-(S.gById[b.group_id]?.sort_order||0)||a.list_number-b.list_number);
  if(!list.length) return '<div class="empty">لا يوجد تلاميذ.</div>';
  return `<div class="tw"><table><tr><th>الرقم</th><th>الاسم واللقب</th><th>الفوج</th><th>الجنس</th><th>الحالة</th><th>الغيابات</th><th>المعدل</th><th></th></tr>${list.map(s=>`<tr class="click" onclick="openStudent('${s.id}')"><td>${s.list_number}</td><td><b>${esc(s.first_name)} ${esc(s.last_name)}</b></td><td>${esc(S.gById[s.group_id]?.name||'')}</td><td>${esc(s.sex)}</td><td><span class="tag ${s.status==='مسجل'?'':'low'}">${esc(s.status)}</span></td><td>${countAbs(s.id)}</td><td>${f2(genAvg(s))}</td><td><button class="btn ghost sm" onclick="event.stopPropagation();toggleArchive('${s.id}')">${s.status==='مسجل'?'أرشفة':'استرجاع'}</button> <button class="btn danger sm" onclick="event.stopPropagation();delStudent('${s.id}')">حذف</button></td></tr>`).join('')}</table></div>`;
}
async function addStudent(){
  const g=curG();if(!g) return say('اختر فوجًا أولًا.',false);
  const first=$('stFirst').value.trim(),last=$('stLast').value.trim(),birth=$('stBirth').value,sex=$('stSex').value;
  if(!first||!last||!birth) return say('الاسم واللقب وتاريخ الميلاد مطلوبة.',false);
  const {data,error}=await sb.from('students').insert({school_id:S.school.id,group_id:g.id,list_number:nextNo(g.id),first_name:first,last_name:last,birth_date:birth,sex}).select().single();
  if(error){const dup=error.message.includes('duplicate')||error.message.includes('unique');return say(dup?'رقم الترتيب مكرر في هذا الفوج، أعد المحاولة.':'لم يُحفظ التلميذ: '+error.message,false);}
  S.students.push(data);S._dirty=true;say('تمت إضافة التلميذ بنجاح.');
  $('stFirst').value='';$('stLast').value='';$('stBirth').value='';
  $('stTable').innerHTML=studentsTable();renderTop();
}
async function toggleArchive(id){
  const s=S.students.find(x=>x.id===id);if(!s) return;
  const next=s.status==='مسجل'?'مؤرشف':'مسجل';
  const {error}=await sb.from('students').update({status:next}).eq('id',id);
  if(error) return say('لم يُحفظ التغيير: '+error.message,false);
  s.status=next;S._dirty=true;say(next==='مؤرشف'?'تمت أرشفة التلميذ.':'تم استرجاع التلميذ.');
  $('stTable').innerHTML=studentsTable();renderTop();
}
async function delStudent(id){
  if(!confirm('حذف هذا التلميذ نهائيًا مع علاماته وغياباته؟')) return;
  const {error}=await sb.from('students').delete().eq('id',id);
  if(error) return say('تعذر الحذف: '+error.message,false);
  S.students=S.students.filter(s=>s.id!==id);delete S.G[id];delete S.absBy[id];
  if(S.stId===id) S.stId=null;
  S._dirty=true;say('تم الحذف.');render();
}
function openStudent(id){const s=S.students.find(x=>x.id===id);if(!s) return;S.gid=s.group_id;S.stId=id;S.stTab='info';S.view='students';render();window.scrollTo(0,0);}
function openCard(id){openStudent(id);S.stTab='report';render();}
function closeSt(){S.stId=null;render();}
function setStTab(t){S.stTab=t;render();}

function stPageHtml(){
  const st=curSt(),g=S.gById[st.group_id];

function stInfo(st){
  return `<div class="fgrid"><label class="f">الاسم<input id="sf_first" value="${esc(st.first_name)}"></label><label class="f">اللقب<input id="sf_last" value="${esc(st.last_name)}"></label><label class="f">تاريخ الميلاد<input id="sf_birth" type="date" value="${esc(st.birth_date)}"></label><label class="f">الجنس<select id="sf_sex"><option ${st.sex==='ذكر'?'selected':''}>ذكر</option><option ${st.sex==='أنثى'?'selected':''}>أنثى</option></select></label>
  <label class="f">الفوج (للنقل بين الأفواج)<select id="sf_group">${S.groups.map(g=>`<option value="${g.id}" ${g.id===st.group_id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label>
  <label class="f">اسم ولي الأمر<input id="sf_guard" value="${esc(st.guardian_name||'')}"></label><label class="f">رقم الاتصال<input id="sf_phone" value="${esc(st.guardian_phone||'')}"></label></div>
  <label class="f" style="margin-top:12px">ملاحظات إدارية وتربوية<textarea id="sf_notes" rows="3">${esc(st.admin_notes||'')}</textarea></label>
  <button class="btn" style="margin-top:12px" onclick="saveStInfo()">حفظ المعلومات</button>`;
}
async function saveStInfo(){
  const st=curSt();if(!st) return;
  const patch={first_name:$('sf_first').value.trim(),last_name:$('sf_last').value.trim(),birth_date:$('sf_birth').value,sex:$('sf_sex').value,group_id:$('sf_group').value,guardian_name:$('sf_guard').value.trim(),guardian_phone:$('sf_phone').value.trim(),admin_notes:$('sf_notes').value.trim()};
  if(!patch.first_name||!patch.last_name||!patch.birth_date) return say('الاسم واللقب وتاريخ الميلاد مطلوبة.',false);
  if(patch.group_id!==st.group_id) patch.list_number=nextNo(patch.group_id);
  const {error}=await sb.from('students').update(patch).eq('id',st.id);
  if(error) return say('لم تُحفظ المعلومات: '+error.message,false);
  Object.assign(st,patch);S.gid=st.group_id;S._dirty=true;say('تم حفظ المعلومات.');render();
}
function stGrades(st){
  const lv=S.gById[st.group_id]?.level,subs=S.subjects.filter(s=>s.levels.includes(lv));
  if(!subs.length) return '<div class="empty"><b>لا توجد مواد لهذا المستوى</b>أضفها من الإعدادات.<br><button class="btn" onclick="S.setTab=\'subjects\';navTo(\'settings\')">المواد والمعاملات</button></div>';
  return `<p class="note">العلامات من 0 إلى 20، وتُحفظ فور تغييرها.</p><div class="tw"><table><tr><th>المادة</th>${CC.map(k=>`<th>${CCN[k]}</th>`).join('')}<th>معدل المادة</th><th>ملاحظة الأستاذ</th></tr>${subs.map(s=>{const e=S.G[st.id]?.[s.id]||{};return `<tr><td>${esc(s.name)} <span class="note">(معامل ${s.coef})</span></td>${CC.map(k=>`<td><input type="number" min="0" max="20" step="any" value="${e[k]??''}" aria-label="${CCN[k]}" onchange="sgIn('${s.id}','${k}',this)"></td>`).join('')}<td><b id="ssa-${s.id}">${f2(subAvg(e))}</b></td><td><input class="wide" value="${esc(e.teacher_note||'')}" onchange="sgNote('${s.id}',this.value)"></td></tr>`;}).join('')}</table></div><p style="margin-top:12px"><b>المعدل العام: <span id="sgen">${f2(genAvg(st))}</span> / 20</b></p>`;
}
function parseGrade(el,old){
  const t=el.value.trim();if(t==='') return {v:null};
  const v=Number(t);
  if(!isFinite(v)||v<0||v>20){say('العلامة يجب أن تكون بين 0 و 20.',false);el.value=old??'';return {bad:true};}
  return {v:Math.round(v*100)/100};
}
async function saveGrade(sid,subId,patch){
  const cur={...(S.G[sid]?.[subId]||{}),...patch};
  const payload={student_id:sid,subject_id:subId,cc:cur.cc??null,f1:cur.f1??null,f2:cur.f2??null,ex:cur.ex??null,teacher_note:cur.teacher_note??''};
  const {data,error}=await sb.from('grades').upsert(payload,{onConflict:'student_id,subject_id'}).select().single();
  if(error){say('لم تُحفظ العلامة: '+error.message,false);return false;}

function reportsHtml(){

}
const csvc=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s)) s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
function download(name,text,mime){
  const b=new Blob([text],{type:mime}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function exportCsv(all){
  const groups=all?S.groups:[curG()].filter(Boolean);
  if(!groups.length) return say('لا توجد أفواج للتصدير.',false);
  const head=['الفوج','الرقم','الاسم','اللقب',...S.subjects.map(s=>s.name),'المعدل العام','الغيابات','التأخرات'];
  const lines=[head.map(csvc).join(',')];
  groups.forEach(g=>gStudents(g).forEach(st=>{
    const ab=absOf(st.id);
    lines.push([g.name,st.list_number,st.first_name,st.last_name,...S.subjects.map(s=>s.levels.includes(g.level)?(subAvg(S.G[st.id]?.[s.id])??''):''),genAvg(st)??'',ab.filter(a=>a.kind==='غياب').length,ab.filter(a=>a.kind==='تأخر').length].map(csvc).join(','));
  }));
  download('results-'+today()+'.csv','\uFEFF'+lines.join('\r\n'),'text/csv;charset=utf-8');
  say('تم تجهيز ملف النتائج.');
}

}
function setSubjects(){
  return `<p class="note">المعاملات الافتراضية 1 وهي غير رسمية. عدّلها يدويًا وفق التنظيم المعتمد لكل مستوى.</p>
  <div class="tw"><table><tr><th>المادة</th><th>المعامل</th><th>الأستاذ</th><th>المستويات</th><th></th></tr>${S.subjects.map(s=>`<tr><td><input class="wide" value="${esc(s.name)}" onchange="subUpd('${s.id}',{name:this.value.trim()})"></td><td><input type="number" min="0" step="0.5" value="${s.coef}" onchange="subUpd('${s.id}',{coef:Math.max(0,Number(this.value)||0)})"></td><td><input class="wide" value="${esc(s.teacher_name||'')}" onchange="subUpd('${s.id}',{teacher_name:this.value.trim()})"></td><td>${[1,2,3,4].map(l=>`<label class="row note" style="display:inline-flex;gap:3px;margin-inline-end:8px"><input type="checkbox" style="width:auto" ${s.levels.includes(l)?'checked':''} onchange="subLevel('${s.id}',${l},this.checked)">م${l}</label>`).join('')}</td><td><button class="btn danger sm" onclick="subDel('${s.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="5" class="note">لا توجد مواد بعد.</td></tr>'}</table></div>
  <h3 style="margin:18px 0 10px;color:var(--wd)">إضافة مادة</h3><div class="fgrid"><label class="f">اسم المادة<input id="ns_name"></label><label class="f">المعامل<input id="ns_coef" type="number" min="0" step="0.5" value="1"></label><label class="f">الأستاذ<input id="ns_teacher"></label></div>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="addSubject()">${ic('plus')}إضافة مادة</button><button class="btn ghost" onclick="addProposed()">إضافة القائمة المقترحة بمعامل 1</button></div>`;
}
async function subUpd(id,patch){
  const {error}=await sb.from('subjects').update(patch).eq('id',id);
  if(error) return say('لم يُحفظ التعديل: '+error.message,false);
  Object.assign(S.subjects.find(s=>s.id===id),patch);S._dirty=true;say('تم الحفظ.');
}
function subLevel(id,l,on){
  const s=S.subjects.find(x=>x.id===id);
  subUpd(id,{levels:on?[...new Set([...s.levels,l])].sort():s.levels.filter(x=>x!==l)});
}
async function subDel(id){
  if(!confirm('حذف المادة وكل علاماتها؟')) return;
  const {error}=await sb.from('subjects').delete().eq('id',id);
  if(error) return say('تعذر الحذف: '+error.message,false);
  S.subjects=S.subjects.filter(s=>s.id!==id);
  Object.values(S.G).forEach(o=>delete o[id]);
  S._dirty=true;say('تم حذف المادة.');render();
}
async function addSubject(){
  const name=$('ns_name').value.trim();if(!name) return say('اكتب اسم المادة.',false);
  const {data,error}=await sb.from('subjects').insert({school_id:S.school.id,name,coef:Math.max(0,Number($('ns_coef').value)||0),teacher_name:$('ns_teacher').value.trim(),sort_order:S.subjects.length+1}).select().single();
  if(error) return say('لم تُضف المادة: '+error.message,false);
  S.subjects.push({...data,coef:Number(data.coef),levels:data.levels||[]});S._dirty=true;say('تمت إضافة المادة.');render();
}
async function addProposed(){
  if(S.subjects.length&&!confirm('لديك مواد بالفعل. هل تضيف القائمة المقترحة أيضًا؟')) return;
  const rows=PROPOSED.map((name,i)=>({school_id:S.school.id,name,coef:1,teacher_name:'',sort_order:S.subjects.length+i+1}));
  const {data,error}=await sb.from('subjects').insert(rows).select();
  if(error) return say('لم تُضف القائمة: '+error.message,false);
  data.forEach(d=>S.subjects.push({...d,coef:Number(d.coef),levels:d.levels||[]}));
  S._dirty=true;say(`أُضيفت ${data.length} مادة بمعامل 1 قابل للتعديل.`);render();
}
function setWeights(){
  const s=S.school;
  return `<div class="fgrid"><label class="f">وزن التقويم المستمر<input id="w_cc" type="number" min="0" step="0.5" value="${s.weight_cc}"></label><label class="f">وزن الفرض الأول<input id="w_f1" type="number" min="0" step="0.5" value="${s.weight_f1}"></label><label class="f">وزن الفرض الثاني<input id="w_f2" type="number" min="0" step="0.5" value="${s.weight_f2}"></label><label class="f">وزن الاختبار<input id="w_ex" type="number" min="0" step="0.5" value="${s.weight_ex}"></label><label class="f">حد تنبيه الغيابات<input id="w_lim" type="number" min="1" value="${s.absence_limit}"></label></div><p class="note">هذه الأوزان مؤقتة وليست صيغة رسمية. عدّلها وفق النص المعتمد.</p><button class="btn" onclick="saveWeights()">حفظ الأوزان</button>`;
}
async function saveWeights(){
  const patch={weight_cc:+$('w_cc').value||0,weight_f1:+$('w_f1').value||0,weight_f2:+$('w_f2').value||0,weight_ex:+$('w_ex').value||0,absence_limit:Math.max(1,+$('w_lim').value||10)};
  const {data,error}=await sb.from('schools').update(patch).eq('id',S.school.id).select().single();
  if(error) return say('لم تُحفظ الأوزان: '+error.message,false);
  Object.assign(S.school,data);S._dirty=true;say('تم حفظ الأوزان.');render();
}
function setAccount(){
  return `<div class="fgrid"><label class="f">البريد الإلكتروني<input value="${esc(S.user?.email||'')}" readonly></label><label class="f">كلمة المرور الجديدة (12 حرفًا على الأقل)<input id="np" type="password" autocomplete="new-password"></label></div>${S.recovering?'<p class="note">أدخل كلمة المرور الجديدة ثم احفظها.</p>':''}<button class="btn" style="margin-top:12px" onclick="changePw()">حفظ كلمة المرور الجديدة</button>`;
}
async function changePw(){
  const p=$('np').value;
  if(p.length<12) return say('كلمة المرور يجب أن تكون 12 حرفًا على الأقل.',false);
  const {error}=await sb.auth.updateUser({password:p});
  if(error) return say('لم تُحفظ كلمة المرور: '+error.message,false);
  $('np').value='';S.recovering=false;say('تم تغيير كلمة المرور بنجاح.');
}
function setBackup(){
  return `<p>تنزيل نسخة كاملة من بيانات المؤسسة النشطة (الأفواج والمواد والتلاميذ والعلامات والغيابات) بصيغة JSON للاحتفاظ بها.</p><button class="btn" onclick="exportBackup()">${ic('down')}تنزيل نسخة احتياطية</button><p class="note" style="margin-top:12px">استعادة البيانات من هذا الملف غير متاحة بعد، فهي خطوة لاحقة. احتفظ بالملف في مكان آمن لأنه يحتوي على بيانات التلاميذ.</p>`;
}
function exportBackup(){
  const grades=[];Object.entries(S.G).forEach(([sid,o])=>Object.entries(o).forEach(([sub,e])=>grades.push({student_id:sid,subject_id:sub,cc:e.cc,f1:e.f1,f2:e.f2,ex:e.ex,teacher_note:e.teacher_note||''})));
  const absences=Object.values(S.absBy).flat().map(({id,student_id,subject_id,record_date,kind,justified,minutes,reason})=>({id,student_id,subject_id,record_date,kind,justified,minutes,reason}));
  const data={format:'tmv-backup',version:2,exportedAt:new Date().toISOString(),school:S.school,groups:S.groups,subjects:S.subjects,students:S.students,grades,absences};
  download('backup-'+today()+'.json',JSON.stringify(data,null,1),'application/json');
  say('تم تجهيز النسخة الاحتياطية.');
}
</script>
</body>
</html>
